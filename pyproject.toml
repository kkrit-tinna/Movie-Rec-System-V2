[project]
name = "movierec"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "scikit-learn",
    "scipy",
    "joblib",
    "pyarrow",
    "pyyaml",
    "kaggle",
    "gensim",
    "psutil",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "moto[s3,dynamodb]"]
# Serving only (T4.4); kept out of the base deps so the batch image does not grow.
# mangum + a2wsgi: Lambda (ASGI) in front of the Flask (WSGI) app.
api = ["flask", "rapidfuzz", "mangum", "a2wsgi"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
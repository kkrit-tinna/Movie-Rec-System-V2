catalog:
  min_overview_chars: 40
  min_vote_count: 10
  exclude_adult: true
  status: ["Released"]

tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.6
  sublinear_tf: true
  stop_words: english

word2vec:
  # Local KeyedVectors file, loaded with mmap. Preferred when set; the env var
  # MOVIEREC_WORD2VEC_MODEL_PATH overrides it. Phase 4 bakes the model into
  # the container image and sets this path.
  model_path: null
  # gensim downloader fallback, used only when no model_path is set.
  model_name: glove-wiki-gigaword-100

index:
  k: 10
  # Query rows per similarity block; the TF-IDF block (dense + sparse
  # product) is step 4's memory spike and grows with the catalog. Full run
  # peak at 77K catalog: 2000 -> 3.44 GiB, 1000 -> 2.58 GiB of the 4 GiB
  # Fargate task, same step 4 time, identical output (§9 2026-10-07;
  # 5000 -> 2000 on 09-18).
  chunk_size: 1000

eval:
  # Peak-RSS sampling interval for the comparison harness (T2.2).
  rss_sample_seconds: 0.01
  # Accuracy query set (T2.3): up to n_queries movies with vote_count >=
  # query_min_vote_count, drawn with this seed. The random baseline uses the
  # same seed on a separate stream.
  n_queries: 2000
  query_min_vote_count: 50
  seed: 42

quality:
  row_count_min: 1300000
  row_count_drift_pct: 15
  catalog_count_min: 70000
  null_rate_max:
    title: 0.001
    overview: 0.60
  duplicate_id_rate_max: 0.0
  embedding_nan_rate_max: 0.0
  zero_vector_rate_max: 0.02

dynamo:
  # DynamoWriter (T4.2b): resends of BatchWriteItem UnprocessedItems per
  # batch, and the base of the exponential backoff (seconds; full jitter,
  # sleep ~ U(0, base_delay * 2**attempt)). Env vars
  # MOVIEREC_DYNAMO_MAX_RETRIES / MOVIEREC_DYNAMO_BASE_DELAY override.
  max_retries: 8
  base_delay: 0.1
  # Table written by pipeline.py step 7; matches infra/ (§7 T4.1).
  table_name: movies

pipeline:
  # Method current.json points at after a successful run, i.e. what the site
  # serves by default. TF-IDF per docs/comparison.md (§9 2026-09-27); set
  # here in T4.3, where pipeline.py first reads it (§9 2026-09-28).
  default_method: tfidf

storage:
  # get_store() (storage/factory.py) precedence: explicit argument, then env
  # STORAGE_BACKEND / MOVIEREC_S3_BUCKET, then these values, then code
  # default. bucket stays null in git: it carries the account ID and is
  # supplied by env (.env locally, the task definition on Fargate).
  backend: local
  bucket: null

catalog:
  min_overview_chars: 40
  min_vote_count: 10
  exclude_adult: true
  status: ["Released"]

tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  min_df: 3
  max_df: 0.6
  sublinear_tf: true
  stop_words: english

word2vec:
  # Local KeyedVectors file, loaded with mmap. Preferred when set; the env var
  # MOVIEREC_WORD2VEC_MODEL_PATH overrides it. Phase 4 bakes the model into
  # the container image and sets this path.
  model_path: null
  # gensim downloader fallback, used only when no model_path is set.
  model_name: glove-wiki-gigaword-100

index:
  k: 10
  chunk_size: 2000

eval:
  # Peak-RSS sampling interval for the comparison harness (T2.2).
  rss_sample_seconds: 0.01
  # Accuracy query set (T2.3): up to n_queries movies with vote_count >=
  # query_min_vote_count, drawn with this seed. The random baseline uses the
  # same seed on a separate stream.
  n_queries: 2000
  query_min_vote_count: 50
  seed: 42

quality:
  row_count_min: 1300000
  row_count_drift_pct: 15
  catalog_count_min: 70000
  null_rate_max:
    title: 0.001
    overview: 0.60
  duplicate_id_rate_max: 0.0
  embedding_nan_rate_max: 0.0
  zero_vector_rate_max: 0.02

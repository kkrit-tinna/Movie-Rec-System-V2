# Overlay for runs on the two committed 5,000-row samples. Merged over
# default.yaml by `--config config/sample.yaml` (pipeline and local API); only
# the keys below change.
#   data/sample/movies_5k.csv    random draw, catalog 262 (§9 2026-09-16); the tests
#   data/sample/movies_demo.csv  5,000 most-voted rows, catalog 5,000; `make demo` (T4.6)
# The floors are set by the smaller catalog and are still real: a truncated
# sample or a filter change that collapses the 5k catalog fails.
# Exception to "thresholds live in default.yaml", logged in §9 2026-10-06.
quality:
  row_count_min: 5000
  catalog_count_min: 250
storage:
  # Its own store, because the row_count_drift_pct gate compares against the
  # latest earlier report in the same store: a sample run in a store holding a
  # full-size run would fail it (§9 2026-10-31).
  local_root: demo_artifacts
